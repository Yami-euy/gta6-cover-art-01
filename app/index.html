<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE HEAT — Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>VICE HEAT</h1>
    <p class="sub">Cover Studio — one hero photo, three accent panels, one sunset poster.</p>

    <label>Your photos <input id="photo" type="file" accept="image/*" multiple></label>
    <p class="hint">Uploads stay on your machine. No photo? The two samples below are already loaded.</p>

    <label>Title <input id="title" type="text" maxlength="24" value="VICE HEAT"></label>
    <label>Subtitle (neon script) <input id="subtitle" type="text" maxlength="32" value="paid in sunsets"></label>
    <label>Tagline <input id="tagline" type="text" maxlength="48" value="FIVE FRIENDS · ONE COAST · NO WAY BACK"></label>
    <label>Press quote <input id="quote" type="text" maxlength="40" value="THE HOTTEST RIDE OF THE YEAR"></label>

    <div class="group">
      <span class="group-label">Export size</span>
      <div class="buttons">
        <button type="button" data-size="1080x1080" class="active">1080 x 1080</button>
        <button type="button" data-size="1080x1350">1080 x 1350</button>
        <button type="button" data-size="1920x1080">1920 x 1080</button>
      </div>
    </div>

    <div class="group">
      <span class="group-label">Colour grade</span>
      <div class="buttons">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="gold">Gold</button>
      </div>
    </div>

    <div class="group">
      <span class="group-label">Hero photo — the big one on top</span>
      <div id="hero-panel"></div>
    </div>

    <div class="group">
      <span class="group-label">Accent panels — photo, role, grade, crop</span>
      <div id="panels"></div>
    </div>

    <button id="export" type="button" class="export">Export PNG 1080 x 1080</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
